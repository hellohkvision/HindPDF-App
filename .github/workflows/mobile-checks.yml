name: Mobile checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run engine
      - run: npm run typecheck
      - run: npm test
      - run: npx expo export --platform android --output-dir /tmp/hindpdf-android
      - run: npx expo export --platform ios --output-dir /tmp/hindpdf-ios
