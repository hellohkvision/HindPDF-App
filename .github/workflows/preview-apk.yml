name: Build test APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/preview-apk.yml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22   # Node version ko 20 se update karke 22 kiya gaya hai

      - uses: actions/setup-java@v5   # Java setup v4 se upgrade karke v5 kiya gaya hai
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build offline engine
        run: npm run engine

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build standalone test APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: HindPDF-test-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
